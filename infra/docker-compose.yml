version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: aditiva_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-aditiva_pronto}
      MYSQL_USER: ${DB_USER:-aditiva}
      MYSQL_PASSWORD: ${DB_PASS:-aditiva123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: aditiva_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-aditiva_pronto}
      DB_USER: ${DB_USER:-aditiva}
      DB_PASS: ${DB_PASS:-aditiva123}
      EXPORTS_DIR: /app/exports
      GENERATED_DIR: /app/generated
      TEMPLATE_PATH: /app/templates/termo_aditivo.docx
    volumes:
      - app_exports:/app/exports
      - app_generated:/app/generated
      - ../templates:/app/templates:ro
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: aditiva_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  app_exports:
  app_generated:
