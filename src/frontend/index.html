<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aditiva Pronto — Gestão de Termos Aditivos · 41 Tech" />
    <title>Aditiva Pronto — 41 Tech</title>

    <!--
      Aplica o tema salvo ANTES do React montar, evitando flash de tema errado.
      Lê localStorage['theme']; se não existir, usa preferência do sistema.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
